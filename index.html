<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奉仕時間管理アプリ</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="奉仕時間管理" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f4f7f5;
      color: #1f2937;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen pb-16">
  <div id="app" class="max-w-xl mx-auto px-4 pt-5">
    <!-- 初期ローディング表示 -->
    <div id="loading-screen" class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-8 text-center mt-8">
      <div class="inline-block w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-sm text-gray-600">読み込み中...</p>
    </div>

    <!-- ログイン・新規登録画面 -->
    <div id="auth-screen" class="hidden bg-white rounded-2xl shadow-sm border border-emerald-100 p-6 mt-6">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xl mb-2">
          奉
        </div>
        <h1 class="text-xl font-bold text-gray-800">奉仕時間管理アプリ</h1>
        <p class="text-xs text-gray-500 mt-1">アカウントごとに記録と目標を安全に管理できます</p>
      </div>

      <!-- ログイン / 新規登録 切り替えタブ -->
      <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl mb-5">
        <button id="tab-login" type="button" class="py-2 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm transition">
          ログイン
        </button>
        <button id="tab-signup" type="button" class="py-2 text-xs font-bold rounded-lg text-gray-600 hover:text-gray-800 transition">
          新規登録
        </button>
      </div>

      <!-- メール・パスワードフォーム -->
      <form id="email-auth-form" class="space-y-3">
        <div id="signup-name-field" class="hidden">
          <label for="auth-name" class="block text-xs font-medium text-gray-700 mb-1">表示名（任意）</label>
          <input id="auth-name" type="text" placeholder="例：たろう"
            class="w-full px-3.5 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label for="auth-email" class="block text-xs font-medium text-gray-700 mb-1">メールアドレス</label>
          <input id="auth-email" type="email" required autocomplete="email" placeholder="example@mail.com"
            class="w-full px-3.5 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label for="auth-password" class="block text-xs font-medium text-gray-700 mb-1">パスワード（6文字以上）</label>
          <div class="relative">
            <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••"
              class="w-full px-3.5 py-2.5 pr-10 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            <button id="toggle-password-btn" type="button" aria-label="パスワード表示切り替え"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs px-1">
              表示
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <button id="reset-password-btn" type="button" class="text-xs text-emerald-700 hover:underline">
            パスワードをお忘れですか？
          </button>
        </div>

        <p id="auth-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></p>
        <p id="auth-info" class="hidden text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2"></p>

        <button id="email-submit-btn" type="submit"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow-sm transition">
          ログインする
        </button>
      </form>

      <!-- 区切り線 -->
      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white px-3 text-gray-400">または</span>
        </div>
      </div>

      <!-- Googleログインボタン -->
      <button id="google-login-btn" type="button"
        class="w-full py-2.5 px-4 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 text-sm font-bold rounded-xl flex items-center justify-center gap-2.5 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.54-1.14 2.85-2.4 3.72v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.22z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
        Googleでログイン
      </button>
    </div>

    <!-- メインアプリ画面 -->
    <div id="main-screen" class="hidden space-y-4">
      <!-- ヘッダー＆ユーザー情報 -->
      <header class="bg-white rounded-2xl shadow-sm border border-emerald-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="user-avatar" src="" alt="" class="hidden w-8 h-8 rounded-full object-cover border border-emerald-200" />
          <div id="user-avatar-fallback" class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center shrink-0">
            U
          </div>
          <div class="min-w-0">
            <p id="user-name-display" class="text-sm font-bold text-gray-800 truncate">ユーザー</p>
            <p id="user-email-display" class="text-[11px] text-gray-400 truncate"></p>
          </div>
        </div>
        <button id="logout-btn" type="button"
          class="text-xs text-gray-500 hover:text-red-600 px-2.5 py-1.5 rounded-lg hover:bg-red-50 transition shrink-0">
          ログアウト
        </button>
      </header>

      <!-- 月間サマリー＆目標 -->
      <section class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5">
        <div class="flex items-center justify-between mb-3">
          <button id="prev-month-btn" type="button" class="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-700 font-bold">
            &lt;
          </button>
          <h2 id="current-month-label" class="text-base font-bold text-gray-800 tabular-nums">2026年11月</h2>
          <button id="next-month-btn" type="button" class="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-700 font-bold">
            &gt;
          </button>
        </div>

        <div class="text-center py-2">
          <p class="text-xs text-gray-500">今月の合計奉仕時間</p>
          <p id="month-total-text" class="text-3xl font-bold text-emerald-700 tabular-nums mt-0.5">0時間 0分</p>
        </div>

        <!-- 目標プログレス -->
        <div class="mt-3 pt-3 border-t border-gray-100">
          <div class="flex items-center justify-between text-xs text-gray-600 mb-1.5">
            <span id="goal-status-text">目標：未設定</span>
            <button id="edit-goal-btn" type="button" class="text-emerald-700 font-bold hover:underline">
              目標設定
            </button>
          </div>
          <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
            <div id="goal-progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <p id="goal-remain-text" class="text-[11px] text-gray-400 mt-1 text-right tabular-nums"></p>
        </div>

        <button id="copy-report-btn" type="button"
          class="mt-4 w-full py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold rounded-xl border border-emerald-200 transition">
          月間報告テキストをコピー
        </button>
      </section>

      <!-- クイック計測タイマー -->
      <section class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold text-gray-800">クイック計測タイマー</h3>
          <span class="text-[11px] text-gray-400">終了すると下の入力欄に反映</span>
        </div>
        <div id="timer-display" class="text-center text-3xl font-bold text-gray-800 tabular-nums py-2">
          00:00:00
        </div>
        <div class="grid grid-cols-3 gap-2 mt-2">
          <button id="timer-toggle-btn" type="button"
            class="col-span-2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition">
            計測スタート
          </button>
          <button id="timer-reset-btn" type="button"
            class="py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl transition">
            リセット
          </button>
        </div>
        <button id="timer-apply-btn" type="button"
          class="mt-2 w-full py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold rounded-xl transition">
          計測した時間を入力フォームにセット
        </button>
      </section>

      <!-- 記録入力フォーム -->
      <section class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5">
        <h3 class="text-sm font-bold text-gray-800 mb-3">奉仕時間を記録</h3>
        <form id="record-form" class="space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label for="rec-date" class="block text-xs font-medium text-gray-700 mb-1">日付</label>
              <input id="rec-date" type="date" required
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label for="rec-category" class="block text-xs font-medium text-gray-700 mb-1">形態・区分</label>
              <select id="rec-category"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="戸別訪問">戸別訪問</option>
                <option value="街路・公共">街路・公共</option>
                <option value="再訪問・研究">再訪問・研究</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <!-- 入力方法タブ -->
          <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl">
            <button id="mode-duration-btn" type="button" class="py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm">
              時間・分で入力
            </button>
            <button id="mode-range-btn" type="button" class="py-1.5 text-xs font-bold rounded-lg text-gray-600">
              開始〜終了時刻で計算
            </button>
          </div>

          <!-- 時間・分入力 -->
          <div id="duration-inputs" class="grid grid-cols-2 gap-2.5">
            <div>
              <label for="rec-hours" class="block text-xs font-medium text-gray-700 mb-1">時間</label>
              <input id="rec-hours" type="number" min="0" max="24" value="0"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label for="rec-minutes" class="block text-xs font-medium text-gray-700 mb-1">分</label>
              <input id="rec-minutes" type="number" min="0" max="59" step="5" value="30"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>

          <!-- 時刻範囲入力 -->
          <div id="range-inputs" class="hidden space-y-2">
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label for="rec-start" class="block text-xs font-medium text-gray-700 mb-1">開始時刻</label>
                <input id="rec-start" type="time"
                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
              <div>
                <label for="rec-end" class="block text-xs font-medium text-gray-700 mb-1">終了時刻</label>
                <input id="rec-end" type="time"
                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
            </div>
            <p id="range-preview" class="text-xs text-emerald-700 font-medium"></p>
          </div>

          <div>
            <label for="rec-memo" class="block text-xs font-medium text-gray-700 mb-1">メモ（任意）</label>
            <input id="rec-memo" type="text" placeholder="エリア名や気づきなど"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>

          <button type="submit"
            class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow-sm transition">
            記録を追加する
          </button>
        </form>
      </section>

      <!-- 記録一覧 -->
      <section class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5">
        <h3 class="text-sm font-bold text-gray-800 mb-3">この月の記録一覧</h3>
        <div id="records-list" class="space-y-2.5">
          <p class="text-xs text-gray-400 text-center py-6">まだ記録がありません</p>
        </div>
      </section>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg z-50">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      addDoc,
      deleteDoc,
      setDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // =========================================================================
    // ★ ここに、ご自身のFirebaseコンソールで取得した firebaseConfig を貼り付けてください ★
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // 状態管理
    let currentUser = null;
    let currentYearMonth = getCurrentYearMonth();
    let records = [];
    let monthlyGoalMinutes = 0;
    let unsubscribeRecords = null;
    let unsubscribeGoal = null;
    let inputMode = 'duration';

    // タイマー状態
    let timerSeconds = 0;
    let timerInterval = null;

    // 要素参照
    const loadingScreen = document.getElementById('loading-screen');
    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const toastEl = document.getElementById('toast');

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.add('hidden'), 2400);
    }

    function getCurrentYearMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function getTodayDateStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function formatMinutes(totalMin) {
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return `${h}時間 ${m}分`;
    }

    // -------------------------------------------------------------------------
    // 認証画面ロジック
    // -------------------------------------------------------------------------
    let isSignupMode = false;
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const signupNameField = document.getElementById('signup-name-field');
    const emailSubmitBtn = document.getElementById('email-submit-btn');
    const authError = document.getElementById('auth-error');
    const authInfo = document.getElementById('auth-info');

    function setAuthMode(signup) {
      isSignupMode = signup;
      authError.classList.add('hidden');
      authInfo.classList.add('hidden');
      if (signup) {
        tabSignup.className = 'py-2 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm transition';
        tabLogin.className = 'py-2 text-xs font-bold rounded-lg text-gray-600 hover:text-gray-800 transition';
        signupNameField.classList.remove('hidden');
        emailSubmitBtn.textContent = '新規アカウントを作成';
      } else {
        tabLogin.className = 'py-2 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm transition';
        tabSignup.className = 'py-2 text-xs font-bold rounded-lg text-gray-600 hover:text-gray-800 transition';
        signupNameField.classList.add('hidden');
        emailSubmitBtn.textContent = 'ログインする';
      }
    }

    tabLogin.addEventListener('click', () => setAuthMode(false));
    tabSignup.addEventListener('click', () => setAuthMode(true));

    const pwInput = document.getElementById('auth-password');
    const togglePwBtn = document.getElementById('toggle-password-btn');
    togglePwBtn.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      togglePwBtn.textContent = isPw ? '隠す' : '表示';
    });

    document.getElementById('email-auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      authInfo.classList.add('hidden');

      const email = document.getElementById('auth-email').value.trim();
      const password = pwInput.value;
      const displayName = document.getElementById('auth-name').value.trim();

      try {
        if (isSignupMode) {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const finalName = displayName || email.split('@')[0];
          await updateProfile(cred.user, { displayName: finalName });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        authError.textContent = formatAuthError(err.code);
        authError.classList.remove('hidden');
      }
    });

    document.getElementById('reset-password-btn').addEventListener('click', async () => {
      authError.classList.add('hidden');
      authInfo.classList.add('hidden');
      const email = document.getElementById('auth-email').value.trim();
      if (!email) {
        authError.textContent = '再設定メールを送るメールアドレスを入力してください。';
        authError.classList.remove('hidden');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        authInfo.textContent = `${email} 宛にパスワード再設定の案内メールを送信しました。`;
        authInfo.classList.remove('hidden');
      } catch (err) {
        authError.textContent = formatAuthError(err.code);
        authError.classList.remove('hidden');
      }
    });

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      authError.classList.add('hidden');
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        authError.textContent = formatAuthError(err.code);
        authError.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
    });

    function formatAuthError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'メールアドレスの形式が正しくありません。';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'メールアドレスまたはパスワードが一致しません。';
        case 'auth/email-already-in-use': return 'このメールアドレスはすでに登録されています。';
        case 'auth/weak-password': return 'パスワードは6文字以上で設定してください。';
        case 'auth/popup-closed-by-user': return 'ログイン画面が閉じられました。';
        default: return '認証に失敗しました。Firebaseの設定や通信状況をご確認ください。';
      }
    }

    // -------------------------------------------------------------------------
    // 認証状態監視＆Firestore購読
    // -------------------------------------------------------------------------
    onAuthStateChanged(auth, (user) => {
      loadingScreen.classList.add('hidden');
      if (unsubscribeRecords) { unsubscribeRecords(); unsubscribeRecords = null; }
      if (unsubscribeGoal) { unsubscribeGoal(); unsubscribeGoal = null; }

      if (user) {
        currentUser = user;
        authScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        renderUserProfile(user);
        document.getElementById('rec-date').value = getTodayDateStr();
        subscribeUserData(user.uid);
      } else {
        currentUser = null;
        records = [];
        monthlyGoalMinutes = 0;
        mainScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
      }
    });

    function renderUserProfile(user) {
      const name = user.displayName || (user.email ? user.email.split('@')[0] : 'ユーザー');
      document.getElementById('user-name-display').textContent = name;
      document.getElementById('user-email-display').textContent = user.email || '';
      const avatarImg = document.getElementById('user-avatar');
      const avatarFallback = document.getElementById('user-avatar-fallback');
      avatarFallback.textContent = name.charAt(0).toUpperCase();

      if (user.photoURL) {
        avatarImg.src = user.photoURL;
        avatarImg.classList.remove('hidden');
        avatarFallback.classList.add('hidden');
      } else {
        avatarImg.classList.add('hidden');
        avatarFallback.classList.remove('hidden');
      }
    }

    function subscribeUserData(uid) {
      const q = query(collection(db, 'users', uid, 'records'), orderBy('date', 'desc'));
      unsubscribeRecords = onSnapshot(q, (snapshot) => {
        records = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMonthView();
      });

      const goalRef = doc(db, 'users', uid, 'goals', currentYearMonth);
      unsubscribeGoal = onSnapshot(goalRef, (snap) => {
        monthlyGoalMinutes = snap.exists() ? (snap.data().goalMinutes || 0) : 0;
        renderMonthView();
      });
    }

    // 月切り替え
    function shiftMonth(delta) {
      const [y, m] = currentYearMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      currentYearMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (currentUser) {
        if (unsubscribeGoal) unsubscribeGoal();
        const goalRef = doc(db, 'users', currentUser.uid, 'goals', currentYearMonth);
        unsubscribeGoal = onSnapshot(goalRef, (snap) => {
          monthlyGoalMinutes = snap.exists() ? (snap.data().goalMinutes || 0) : 0;
          renderMonthView();
        });
      }
      renderMonthView();
    }

    document.getElementById('prev-month-btn').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('next-month-btn').addEventListener('click', () => shiftMonth(1));

    // 目標設定
    document.getElementById('edit-goal-btn').addEventListener('click', async () => {
      if (!currentUser) return;
      const currentHours = (monthlyGoalMinutes / 60).toString();
      const input = prompt('今月の目標時間を時間単位で入力してください（例：30 や 15.5）\n※0を入力すると未設定になります', currentHours);
      if (input === null) return;
      const parsed = parseFloat(input);
      if (isNaN(parsed) || parsed < 0) {
        showToast('正しい数値を入力してください');
        return;
      }
      const goalMin = Math.round(parsed * 60);
      await setDoc(doc(db, 'users', currentUser.uid, 'goals', currentYearMonth), { goalMinutes: goalMin });
      showToast('月間目標を更新しました');
    });

    // 画面描画
    function renderMonthView() {
      const [y, m] = currentYearMonth.split('-').map(Number);
      document.getElementById('current-month-label').textContent = `${y}年${m}月`;

      const monthRecords = records.filter(r => r.date && r.date.startsWith(currentYearMonth));
      const totalMin = monthRecords.reduce((sum, r) => sum + (Number(r.minutes) || 0), 0);
      document.getElementById('month-total-text').textContent = formatMinutes(totalMin);

      const goalStatus = document.getElementById('goal-status-text');
      const progressBar = document.getElementById('goal-progress-bar');
      const remainText = document.getElementById('goal-remain-text');

      if (monthlyGoalMinutes > 0) {
        const pct = Math.min(100, Math.round((totalMin / monthlyGoalMinutes) * 100));
        goalStatus.textContent = `目標：${formatMinutes(monthlyGoalMinutes)}（${pct}%）`;
        progressBar.style.width = `${pct}%`;
        const diff = monthlyGoalMinutes - totalMin;
        remainText.textContent = diff > 0 ? `あと ${formatMinutes(diff)}` : '目標達成！おめでとうございます';
      } else {
        goalStatus.textContent = '目標：未設定';
        progressBar.style.width = '0%';
        remainText.textContent = '';
      }

      const listEl = document.getElementById('records-list');
      if (monthRecords.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">まだ記録がありません</p>';
        return;
      }

      listEl.innerHTML = monthRecords.map(r => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100">
          <div class="min-w-0 pr-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-gray-800 tabular-nums">${escapeHtml(r.date)}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-medium">${escapeHtml(r.category || 'その他')}</span>
            </div>
            ${r.memo ? `<p class="text-xs text-gray-500 mt-1 truncate">${escapeHtml(r.memo)}</p>` : ''}
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="text-sm font-bold text-emerald-700 tabular-nums">${formatMinutes(Number(r.minutes) || 0)}</span>
            <button type="button" data-delete-id="${r.id}" class="delete-rec-btn text-xs text-gray-400 hover:text-red-600 px-1.5 py-1">
              削除
            </button>
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.delete-rec-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!currentUser) return;
          if (!confirm('この記録を削除しますか？')) return;
          await deleteDoc(doc(db, 'users', currentUser.uid, 'records', btn.dataset.deleteId));
          showToast('記録を削除しました');
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    // 月間報告テキストコピー
    document.getElementById('copy-report-btn').addEventListener('click', async () => {
      const [y, m] = currentYearMonth.split('-').map(Number);
      const monthRecords = records.filter(r => r.date && r.date.startsWith(currentYearMonth));
      const totalMin = monthRecords.reduce((sum, r) => sum + (Number(r.minutes) || 0), 0);
      const text = `${y}年${m}月 奉仕時間報告\n合計：${formatMinutes(totalMin)}（${monthRecords.length}件）`;
      try {
        await navigator.clipboard.writeText(text);
        showToast('報告テキストをコピーしました');
      } catch {
        showToast('コピーに失敗しました');
      }
    });

    // -------------------------------------------------------------------------
    // クイック計測タイマー
    // -------------------------------------------------------------------------
    const timerDisplay = document.getElementById('timer-display');
    const timerToggleBtn = document.getElementById('timer-toggle-btn');

    function renderTimer() {
      const h = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${h}:${m}:${s}`;
    }

    timerToggleBtn.addEventListener('click', () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerToggleBtn.textContent = '計測再開';
      } else {
        timerInterval = setInterval(() => {
          timerSeconds += 1;
          renderTimer();
        }, 1000);
        timerToggleBtn.textContent = '一時停止';
      }
    });

    document.getElementById('timer-reset-btn').addEventListener('click', () => {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      renderTimer();
      timerToggleBtn.textContent = '計測スタート';
    });

    document.getElementById('timer-apply-btn').addEventListener('click', () => {
      if (timerSeconds < 30) {
        showToast('計測時間が短すぎます（1分以上から反映できます）');
        return;
      }
      const totalMin = Math.max(1, Math.round(timerSeconds / 60));
      switchInputMode('duration');
      document.getElementById('rec-hours').value = Math.floor(totalMin / 60);
      document.getElementById('rec-minutes').value = totalMin % 60;
      showToast(`${formatMinutes(totalMin)} を入力欄にセットしました`);
    });

    // -------------------------------------------------------------------------
    // 入力モード切り替え＆記録追加
    // -------------------------------------------------------------------------
    const modeDurationBtn = document.getElementById('mode-duration-btn');
    const modeRangeBtn = document.getElementById('mode-range-btn');
    const durationInputs = document.getElementById('duration-inputs');
    const rangeInputs = document.getElementById('range-inputs');
    const rangePreview = document.getElementById('range-preview');
    const startInput = document.getElementById('rec-start');
    const endInput = document.getElementById('rec-end');

    function switchInputMode(mode) {
      inputMode = mode;
      if (mode === 'duration') {
        modeDurationBtn.className = 'py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm';
        modeRangeBtn.className = 'py-1.5 text-xs font-bold rounded-lg text-gray-600';
        durationInputs.classList.remove('hidden');
        rangeInputs.classList.add('hidden');
      } else {
        modeRangeBtn.className = 'py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm';
        modeDurationBtn.className = 'py-1.5 text-xs font-bold rounded-lg text-gray-600';
        rangeInputs.classList.remove('hidden');
        durationInputs.classList.add('hidden');
        calcRangeMinutes();
      }
    }

    modeDurationBtn.addEventListener('click', () => switchInputMode('duration'));
    modeRangeBtn.addEventListener('click', () => switchInputMode('range'));

    function calcRangeMinutes() {
      if (!startInput.value || !endInput.value) {
        rangePreview.textContent = '';
        return null;
      }
      const [sh, sm] = startInput.value.split(':').map(Number);
      const [eh, em] = endInput.value.split(':').map(Number);
      const diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) {
        rangePreview.textContent = '終了時刻は開始時刻より後を指定してください';
        rangePreview.className = 'text-xs text-red-600 font-medium';
        return null;
      }
      rangePreview.textContent = `計算結果：${formatMinutes(diff)}`;
      rangePreview.className = 'text-xs text-emerald-700 font-medium';
      return diff;
    }

    startInput.addEventListener('change', calcRangeMinutes);
    endInput.addEventListener('change', calcRangeMinutes);

    document.getElementById('record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const date = document.getElementById('rec-date').value;
      const category = document.getElementById('rec-category').value;
      const memo = document.getElementById('rec-memo').value.trim();

      let minutes = 0;
      if (inputMode === 'duration') {
        const h = parseInt(document.getElementById('rec-hours').value, 10) || 0;
        const m = parseInt(document.getElementById('rec-minutes').value, 10) || 0;
        minutes = h * 60 + m;
      } else {
        const diff = calcRangeMinutes();
        if (!diff) {
          showToast('開始・終了時刻を確認してください');
          return;
        }
        minutes = diff;
      }

      if (minutes <= 0) {
        showToast('1分以上の時間を入力してください');
        return;
      }

      await addDoc(collection(db, 'users', currentUser.uid, 'records'), {
        date,
        category,
        minutes,
        memo,
        createdAt: Date.now()
      });

      document.getElementById('rec-memo').value = '';
      showToast(`${formatMinutes(minutes)} を記録しました`);
    });
  </script>
</body>
</html>
